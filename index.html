<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby or Bust｜我們這一班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Poster";src:url(poster.woff2) format("woff2");font-weight:900;font-display:block}
:root{--pink:#E8A9B0;--hot:#D6336C;--paper:#F3ECE9;--grey:#9C9898;--ink:#3A3434;--night:#2F3B52;--memo:#FFF3B0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night)}
body{color:var(--ink);font-family:"Huninn","Noto Sans CJK TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#feed{max-width:440px;margin:0 auto;padding:0 14px 45vh;display:flex;flex-direction:column;gap:12px}
.hand{font-family:"LXGW WenKai TC","Noto Serif CJK TC",serif}
.in{animation:in .4s both}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.yr{color:var(--paper);font-size:30px;letter-spacing:3px;padding:34px 0 0;text-align:center;font-weight:bold}
/* chat */
.bub{align-self:flex-start;background:#fff;border-radius:14px;padding:7px 11px;font-size:15px;line-height:1.45;max-width:86%}
.bub i{display:block;font-style:normal;font-size:12px;color:#8a8080;margin-bottom:1px}
.bub.gone{filter:grayscale(1);opacity:.6}
/* boss memo = ask */
.memo{background:var(--memo);border-radius:12px;padding:12px 16px;box-shadow:0 3px 0 #0003}
.memo i{display:block;font-style:normal;font-size:13px;color:#8a7a40;margin-bottom:4px}
.memo p{font-size:17px;line-height:1.5;font-weight:bold}
.memo p+p{font-weight:normal}
.note{align-self:flex-end;background:var(--memo);padding:8px 12px;font-size:15px;transform:rotate(2deg);box-shadow:0 2px 4px #0004;max-width:78%}
.note i{font-style:normal;font-size:12px;color:#8a7a40;margin-right:6px}
/* wall */
.wall{position:relative;height:min(78vh,620px);min-height:420px;border:2px solid var(--paper);border-radius:4px;overflow:hidden;touch-action:none;box-shadow:0 8px 20px #0007;background:#ddd}
.wall.done{touch-action:pan-y}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.half.U{top:0}.half.D{bottom:0}
.half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s,filter .35s}
.half .po{opacity:0}
.half .re{filter:saturate(.55)}
.half.on .po{opacity:1}.half.on .re{opacity:0}
.half.off .re{filter:grayscale(1) brightness(1.05)}
.half.cut{filter:grayscale(1);opacity:.55}
.h1{position:absolute;left:0;right:0;top:9%;text-align:center;font-family:"Poster",sans-serif;font-weight:900;color:#fff;-webkit-text-stroke:5px var(--hot);paint-order:stroke fill;line-height:1.05;padding:0 10px;opacity:0;transition:opacity .3s;letter-spacing:1px}
.sub{position:absolute;left:50%;transform:translateX(-50%);top:calc(9% + var(--h1h,52px) + 6px);max-width:92%;text-align:center;white-space:normal!important;line-height:1.25;background:var(--hot);color:#fff;font-family:"Poster",sans-serif;font-weight:900;font-size:15px;border-radius:16px;padding:4px 14px;opacity:0;transition:opacity .3s}
.half.on .h1,.half.on .sub{opacity:1}
.tag{position:absolute;left:10px;background:#fffd;border-radius:16px;padding:3px 12px;font-size:14px;font-weight:bold;z-index:2}
.tag{bottom:10px}
.aside{position:absolute;right:10px;background:#3A3434e6;color:var(--paper);border-radius:6px;padding:4px 10px;font-size:14px;z-index:2;transition:opacity .3s}
.U .aside{bottom:10px}.D .aside{bottom:10px}
.half.on .aside{opacity:0}
.fold{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);background:repeating-linear-gradient(90deg,#F3ECE9 0 10px,transparent 10px 18px);z-index:3}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#1E2638e6;color:var(--paper);border-radius:18px;padding:8px 16px;font-size:14px;text-align:center;line-height:1.5;pointer-events:none;white-space:nowrap}
.hint b{display:block;font-size:22px;animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
.pill{background:#1E2638;color:var(--paper);border-radius:16px;padding:5px 14px;font-size:14px}
.btn{border:0;border-radius:22px;padding:10px 28px;font:inherit;font-size:17px;font-weight:bold;background:var(--pink);color:var(--ink)}
.btn.lite{background:var(--paper)}
/* cards */
.photo{background:var(--paper);padding:8px 8px 10px;border-radius:3px;box-shadow:0 3px 8px #0005}
.photo img{width:100%;display:block}
.photo p{font-size:15px;text-align:center;margin-top:6px}
.baby{align-self:flex-start;width:62%;background:#fff;padding:7px 7px 9px;transform:rotate(-1.5deg);box-shadow:0 3px 8px #0005}
.baby img{width:100%;display:block}
.baby p{font-size:14px;margin-top:5px}
.life{align-self:center;width:74%;background:#e2dedc;padding:12px;font-size:15px;line-height:1.5;text-align:center;transform:rotate(1deg);box-shadow:0 3px 8px #0005}
.line{align-self:center;color:var(--paper);font-size:15px;line-height:1.6;text-align:center;max-width:90%;opacity:.9}
.class{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--paper);padding:10px 6px;border-radius:3px}
.mate{text-align:center;font-size:12px;transition:transform 1.5s ease-in,opacity 1.5s ease-in}
.mate img{width:100%;display:block;border-radius:50%;aspect-ratio:1;object-fit:cover;object-position:top}
.mate.g{filter:grayscale(1);opacity:.6}
.mate.walk{transform:translateX(120px);opacity:0}
.mate.empty img{visibility:hidden}.mate.empty{outline:1.5px dashed #b9b2b0;outline-offset:-2px;color:#b9b2b0;border-radius:8px;transition:none}
.qs{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;max-width:94%}
.qs button{border:1px solid #b9b2b0;background:transparent;color:var(--paper);border-radius:14px;padding:4px 10px;font:inherit;font-size:13px}
.qs button:disabled{opacity:.35}
.verdict{color:var(--paper);font-size:22px;font-weight:bold;text-align:center;line-height:1.4;padding:10px 0}
.src{color:#a9a4a2;font-size:12px;line-height:1.7}
.credit{color:#8f8a88;font-size:11px;line-height:1.6;text-align:center}
.title{color:var(--paper);text-align:center;padding:28vh 0 0}
.title h1{font-family:"Poster",sans-serif;font-size:40px;-webkit-text-stroke:4px var(--hot);paint-order:stroke fill;color:#fff}
.title button{margin-top:28px}
.lang{position:fixed;top:10px;left:max(10px,calc(50% - 210px));z-index:5;border:0;border-radius:14px;padding:4px 10px;font:inherit;font-size:13px;background:#F3ECE9cc}
#files{position:fixed;top:10px;right:max(10px,calc(50% - 210px));display:flex;flex-direction:column-reverse;width:34px;z-index:5;pointer-events:none}
#files div{height:4px;margin-top:1px;background:#e9dcc6;border:1px solid #b9a98f}
</style>
</head>
<body>
<button id="lang" class="lang">EN</button>
<div id="files"></div>
<div id="feed"></div>
<script src="data.js"></script>
<script>
// Baby or Bust — 我們這一班. Written from scratch during the Meta hackathon (2026-10-27). Spec: docs/spec/.
const N=DATA.nodes,U=DATA.ui;let L=0;
const tx=a=>Array.isArray(a)?(a[L]||a[0]):(a||'');
const nm=w=>L?(DATA.names[w]||w):w;
const S={node:'y2018',self:0,gone:[],cutIn:{},seenAside:[],laoyanGray:false,path:[],step:0,busy:false,tags:{},babies:[],baby:1};
const feed=document.getElementById('feed');
const SAT=[1,.9,.8,.7,.62,.55,.48];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const sat=()=>SAT[Math.min(S.step,SAT.length-1)];
function add(cls,html,s){const d=document.createElement('div');d.className=cls+' in';d.innerHTML=html;if(s!=null&&s<1)d.style.filter='saturate('+s+')';feed.appendChild(d);return d}
function down(el,c){el.scrollIntoView({behavior:'smooth',block:c?'center':'end'})}
function files(){document.getElementById('files').innerHTML='<div></div>'.repeat(1+S.step*2+S.self*3)}
function tagOf(w){const t=S.tags[w]||DATA.tag[w];return t?nm(w)+(L?' (':'（')+tx(t)+(L?')':'）'):nm(w)}
function bub(w,t,s,gone){return down(add('bub'+(gone?' gone':''),'<i>'+tagOf(w)+'</i>'+tx(t),s))}
// ---------- opening (C9) ----------
async function opening(){
  add('yr','2018');
  for(const [w,t] of DATA.open){bub(w,t);await wait(550)}
  await wait(300);
  const p=add('photo','<img src="img/open_back.webp" alt=""><p class="hand">'+tx(U.promise)+'</p>');down(p);await wait(1200);
  down(add('line hand',tx(U.intro)));await wait(400);
  const b=add('ctl','<button class="btn">'+tx(U.start)+'</button>');down(b);
  b.querySelector('button').onclick=()=>{b.remove();planBabies();files();year()};
}
function planBabies(){const n=1+Math.floor(Math.random()*5);const steps=[1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,n);S.babies=steps}
// ---------- a year ----------
async function year(){
  const n=N[S.node],s=sat();
  for(const h of 'UD'){if(n[h].named&&n[h].tag)S.tags[n[h].who]=n[h].tag}
  if(S.step>0)add('yr',n.year,s);await wait(250);
  if(n.year===2019)add('life hand',tx(U.obj19),s);
  const m=add('memo','<i>'+nm('主管')+'</i><p>'+tx(n.ask[0])+'</p><p>'+tx(n.ask[1])+'</p>',s);down(m);await wait(700);
  const gap=n.flood?260:650;
  for(const [w,t] of n.setup){bub(w,t,s,S.gone.includes(w));await wait(gap)}
  await wait(300);
  const half=h=>{const x=n[h],who=x.named?tagOf(x.who):tx(x.whoE);
    const showAside=h==='D'?(!S.seenAside.includes(x.who)||n.final):true;
    return '<div class="half '+h+'"><img class="re" src="img/'+S.node+'_'+h+'_real.webp" alt=""><img class="po" src="img/'+S.node+'_'+h+'_poster.webp" alt="">'+
     '<div class="h1">'+tx(x.h1)+'</div><div class="sub">'+tx(x.sub)+'</div><div class="tag">'+who+'</div>'+(showAside?'<div class="aside hand">'+tx(x.aside)+'</div>':'')+'</div>'};
  const w=add('wall',half('U')+half('D')+'<div class="fold"></div>'+(S.step===0?'<div class="hint"><b>⇅</b>'+tx(U.hint)+'</div>':''),s);
  S.seenAside.push(n.D.who);
  const ctl=add('ctl','',s);
  fitH1(w);bindWall(w,ctl);down(w,1);
}
function fitH1(w){w.querySelectorAll('.half').forEach(h=>{const e=h.querySelector('.h1'),sb=h.querySelector('.sub');const max=h.clientHeight*(L?.46:.4);
  e.style.opacity=1;let fs=58;e.style.fontSize=fs+'px';while((e.scrollHeight>max||e.scrollWidth>e.clientWidth+1)&&fs>18){fs-=2;e.style.fontSize=fs+'px'}
  e.style.opacity='';e.style.webkitTextStroke=Math.max(3,Math.round(fs/10))+'px var(--hot)';h.style.setProperty('--h1h',e.scrollHeight+'px')})}
function bindWall(w,ctl){
  let y0=null,x0=null,pick=null;
  const set=h=>{pick=h;const o=h==='U'?'D':'U';
    w.querySelector('.half.'+h).className='half '+h+' on';w.querySelector('.half.'+o).className='half '+o+' off';
    w.querySelectorAll('.hint').forEach(e=>e.remove());
    ctl.innerHTML='<div class="pill">'+tx(h==='D'?U.hint_up:U.hint_down)+'</div><button class="btn">'+tx(U.pub)+'</button>';
    ctl.querySelector('button').onclick=()=>{if(pick&&!S.busy)publish(w,ctl,pick)};down(ctl);};
  w.addEventListener('pointerdown',e=>{if(w.classList.contains('done'))return;y0=e.clientY;x0=e.clientX});
  w.addEventListener('pointerup',e=>{if(y0===null)return;const dy=e.clientY-y0,dx=e.clientX-x0;y0=null;
    if(Math.abs(dy)>36&&Math.abs(dy)>Math.abs(dx))set(dy<0?'D':'U'); // push away the half you don't keep
    else if(Math.abs(dy)<10&&Math.abs(dx)<10){const r=w.getBoundingClientRect();set(e.clientY-r.top<r.height/2?'U':'D')}});
  w.addEventListener('pointercancel',()=>{y0=null});
}
function cut(id,node){if(!S.gone.includes(id))S.gone.push(id);(S.cutIn[id]=S.cutIn[id]||[]).push(node)}
async function publish(w,ctl,h){
  S.busy=true;const n=N[S.node],s=sat(),o=h==='U'?'D':'U';
  w.classList.add('done');ctl.remove();
  w.querySelector('.half.'+o).className='half '+o+' cut';w.querySelectorAll('.aside').forEach(e=>e.remove());
  S.path.push({node:S.node,side:h});await wait(500);
  if(n.final){if(h==='U')S.laoyanGray=true;else cut('佩珊',S.node);files();S.busy=false;return reunion()}
  if(h==='U'){if(n.D.named)cut(n.D.who,S.node)}else S.self++;
  files();
  down(add('note hand','<i>'+nm('主管')+'</i>'+tx(n.boss[h]),s));await wait(700);
  const c=n.chat[h];if(c){bub(c[0],c[1],s,S.gone.includes(c[0]));await wait(700)}
  if(h==='D'){down(add('life hand',S.self<=3?tx(DATA.life[S.self]):tx(U.again_night),s));await wait(800)}
  S.step++;
  if(S.babies.includes(S.step)){S.baby++;const who=DATA.babies[(S.baby-2)%DATA.babies.length];const nmz=Object.keys(DATA.slug).find(k=>DATA.slug[k]===who);
    down(add('baby','<img src="img/baby_'+who+'.webp" alt=""><p>'+tx(U.baby).replace('{n}',S.baby).replace('{who}',nm(nmz))+'</p>',s));await wait(900)}
  S.node=n.next[h];S.busy=false;await year();
}
// ---------- reunion ----------
function rkey(m){return m+'|'+S.cutIn[m].slice().sort().join(',')}
async function reunion(){
  await wait(400);add('yr',tx(U.reu));add('memo','<p>'+tx(U.end)+'</p>');await wait(500);
  const ph=add('photo','<img src="img/reunion_front.webp" alt="">');down(ph);await wait(900);
  const cl=add('class',DATA.class_.map(m=>'<div class="mate'+((S.gone.includes(m)||(m==='老顏'&&S.laoyanGray))?' g':'')+'" data-m="'+m+'"><img src="img/p_'+DATA.slug[m]+'.webp" alt=""><div>'+nm(m)+'</div></div>').join(''));
  down(cl);await wait(1300);
  for(const m of S.gone){
    const el=cl.querySelector('[data-m="'+m+'"]');if(el){el.classList.add('walk');setTimeout(()=>{el.classList.remove('walk','g');el.classList.add('empty')},1600)}
    await wait(900);const r=DATA.reunion[rkey(m)];if(!r)continue;
    bub(m,r.line,null,true);
    const qs=add('qs',U.q.map((q,i)=>'<button data-i="'+i+'">'+tx(q)+'</button>').join(''));let last=qs;
    qs.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.disabled=true;const d=add('bub gone','<i>'+tagOf(m)+'</i>'+tx(r.qa[+b.dataset.i]));last.after(d);last=d});
    await wait(1000);
  }
  const tier=S.self>=3?'3+':S.self>=1?'1':'0';const me=DATA.self[tier+(S.laoyanGray?'|gray':'')];
  await wait(500);down(add('line hand',tx(me).replace('{n}',S.self)));
  const v=S.self>=4?'self':(S.gone.length>=3?'gone':'mix');await wait(800);down(add('verdict',tx(DATA.verdict[v])));
  await wait(900);bub('阿芳',[U.kids[0].replace('{n}',S.baby),U.kids[1].replace('{n}',S.baby)]);
  await wait(900);
  add('src','<b>'+tx(U.src)+'</b><br>'+[...new Set(S.path.map(p=>N[p.node].year+'　'+N[p.node].src))].join('<br>')+'<br>2026　行政院 2026-05');
  add('credit',tx(U.credit));
  const b=add('ctl','<button class="btn lite">'+tx(U.again)+'</button>');b.querySelector('button').onclick=()=>location.reload();down(b);S.ended=true;
}
function title(){
  const t=add('title','<h1>'+tx(U.title)+'</h1><button class="btn">'+(L?'Start':'開始')+'</button>');
  t.querySelector('button').onclick=()=>{t.remove();document.getElementById('lang').remove();opening()};
}
document.getElementById('lang').onclick=()=>{L=1-L;document.getElementById('lang').textContent=L?'中文':'EN';feed.innerHTML='';title()};
if(/en/i.test(navigator.language)&&!/zh/i.test(navigator.language)){L=1;document.getElementById('lang').textContent='中文'}
title();
</script></body></html>
