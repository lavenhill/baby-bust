<script>
// Baby or Bust — 我們這一班. One screen per beat; written during the Meta hackathon (2026-10-27). Spec: docs/spec/.
const V='20261028c';if(!DATA.group&&!/reload=/.test(location.search))location.replace(location.pathname+'?reload='+Date.now());
const bust=h=>h.replace(/(img\/\w+\.webp)/g,'$1?v='+V);
const N=DATA.nodes,U=DATA.ui;let L=0;
const tx=a=>Array.isArray(a)?(a[L]||a[0]):(a||'');
const nm=w=>L?(DATA.names[w]||w):w;
const S={node:'y2018',self:0,gone:[],hurt:{},peishanGray:false,cutIn:{},seenAside:[],laoyanGray:false,path:[],step:0,tags:{},babies:[],baby:1};
const deck=document.getElementById('deck'),bd=document.getElementById('bd');
const SAT=[1,.88,.76,.66,.58,.5,.44];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const sat=()=>SAT[Math.min(S.step,SAT.length-1)];
// ---------- deck: one screen at a time; back = review only ----------
const H={list:[],i:-1,next:null,locked:false};
function screen(cls,html,opt={}){
  const d=document.createElement('div');d.className='scr '+cls+' below';d.innerHTML=bust(html);
  if(opt.sat&&opt.sat<1)d.style.filter='saturate('+opt.sat+')';
  deck.appendChild(d);H.list.push(d);go(H.list.length-1);
  if(opt.bg)bd.style.backgroundImage='url('+bust(opt.bg)+')';
  return d}
function go(i){H.list.forEach((s,k)=>{s.classList.toggle('below',k>i);s.classList.toggle('above',k<i)});H.i=i}
function tapNext(scr,label){const t=document.createElement('div');t.className='tapnext';t.textContent=label||(L?'tap to continue':'點一下繼續');scr.appendChild(t);
  return new Promise(r=>{H.next=()=>{t.remove();H.next=null;r()}})}
function forward(){if(H.i<H.list.length-1)go(H.i+1);else if(H.next&&!H.locked)H.next()}
function back(){if(H.i>0)go(H.i-1)}
const cur=()=>H.list[H.i];
deck.addEventListener('click',e=>{const wl=e.target.closest('.wall');if(e.target.closest('button')||(wl&&!wl.classList.contains('done')))return;forward()});
let ty=null;deck.addEventListener('pointerdown',e=>{ty=e.clientY});
deck.addEventListener('pointerup',e=>{if(ty===null)return;const dy=e.clientY-ty;ty=null;if(cur()&&cur().classList.contains('wall')&&!cur().classList.contains('done'))return;
  if(dy>50)back();else if(dy<-50)forward()});
let wheelT=0;addEventListener('wheel',e=>{const now=Date.now();if(now-wheelT<600||Math.abs(e.deltaY)<20)return;wheelT=now;
  const c=cur();if(c&&c.classList.contains('wall')&&!c.classList.contains('done'))return;
  e.deltaY>0?forward():back()},{passive:true});
addEventListener('keydown',e=>{const c=cur();const live=c&&c.classList.contains('wall')&&!c.classList.contains('done');
  if(live){if(e.key==='ArrowUp'||e.key==='1')c.pick('U');else if(e.key==='ArrowDown'||e.key==='2')c.pick('D');else if(e.key==='Enter'||e.key===' '){e.preventDefault();c.commit&&c.commit()}return}
  if(['ArrowDown','PageDown',' ','Enter','ArrowRight'].includes(e.key)){e.preventDefault();forward()}else if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key))back()});
// ---------- helpers ----------
function tagOf(w){const t=S.tags[w]||DATA.tag[w];return t?nm(w)+(L?' (':'（')+tx(t)+(L?')':'）'):nm(w)}
function bubHTML(w,t,gone){return '<div class="bub'+(gone?' gone':'')+'"><i>'+tagOf(w)+'</i>'+tx(t)+'</div>'}
async function stream(box,items,gap){for(const [w,t] of items){box.insertAdjacentHTML('beforeend',bubHTML(w,t,S.gone.includes(w)));await wait(gap)}}
// ---------- opening (C9) ----------
async function opening(){
  const O=DATA.open2,seen=new Set();
  const a=screen('','<img class="full" src="img/pingxi_2018.webp" alt=""><div class="ttl hand">'+tx(O.title)+'</div><div class="wish hand"><i></i>'+tx(O.lead)+'<br><small style="color:#a0743a">'+tx(O.tapl)+'</small></div>'+
    '<div class="lan">'+DATA.class_.map(m=>'<div class="mate" data-m="'+m+'"><div class="lamp">'+nm(m)+'</div><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><span>'+nm(m)+'</span></div>').join('')+'</div>',{bg:'img/pingxi_2018.webp'});
  const wb=a.querySelector('.wish');H.locked=true;
  await new Promise(r=>a.querySelectorAll('.lan .mate').forEach(el=>el.onclick=e=>{e.stopPropagation();const m=el.dataset.m;seen.add(m);el.classList.add('seen');
    wb.innerHTML='<i>'+nm(m)+'</i>'+tx(DATA.wish[m]);
    if(seen.size===6&&!a.querySelector('.btn')){a.insertAdjacentHTML('beforeend','<button class="btn" style="position:absolute;bottom:3%;left:50%;transform:translateX(-50%)">'+tx(O.fly)+'</button>');a.querySelector('.btn').onclick=e2=>{e2.stopPropagation();r()}}}));
  a.querySelector('.btn').remove();a.querySelectorAll('.lan .mate').forEach(el=>{el.onclick=null;el.style.pointerEvents='none'});a.querySelector('.lan').classList.add('fly');await wait(2200);
  wb.innerHTML=tx(O.promise);H.locked=false;await tapNext(a);
  const c=screen('','<img class="full" src="img/desk_day1.webp" alt="">'+row()+'<div class="ttl hand">'+tx(O.day1)+'</div><div class="memo" style="position:relative"><i>'+nm('主管')+'</i><p>'+tx(O.boss1)+'</p><p>'+tx(O.boss2)+'</p></div><div class="spacer"></div><div class="note hand" style="position:relative">'+tx(O.ledger)+'</div><button class="btn">'+tx(U.start)+'</button>',{bg:'img/desk_day1.webp'});
  await new Promise(r=>c.querySelector('button').onclick=e=>{e.stopPropagation();r()});
  S.babies=[1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*5));
  year();
}
async function phoneCall(m){
  const p=screen('call','<img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><b style="font-size:calc(3.2*var(--u))">'+nm(m)+'</b><div class="ring">'+tx(DATA.open2.calling)+'</div><div class="lines" style="display:flex;flex-direction:column;gap:calc(1.2*var(--u));min-height:calc(18*var(--u))"></div>');
  await tapNext(p,L?'tap to answer':'點一下接聽');p.querySelector('.ring').remove();
  H.locked=true;const box=p.querySelector('.lines');for(const l of ((DATA.callN&&DATA.callN[S.node])||DATA.call[m])){box.insertAdjacentHTML('beforeend','<div class="sub2 hand">'+tx(l)+'</div>');await wait(1500)}
  H.locked=false;await tapNext(p);
}
async function leftGroup(m){
  const p=screen('','<div class="spacer"></div><img src="img/fb_'+DATA.slug[m]+'.webp" alt="" style="align-self:center;height:calc(36*var(--u));filter:grayscale(1);opacity:.55;"><div class="sys">'+tx(DATA.open2.left).replace('{who}',nm(m))+'</div><div class="spacer"></div>');
  await tapNext(p);
}
// ---------- a year: group chat → wall → consequence ----------
function row(hit){return '<div class="row">'+DATA.class_.map(m=>{let st='';if(m==='老顏')st=S.self>=3?' x':S.self>=1?' h':'';else{const k=S.hurt[m]||0;st=k>=2?' gone':k===1?' x':''}
  return '<div class="rm'+st+(m===hit?' hit':'')+'"><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><b>'+tx(DATA.wish2[m])+'</b></div>'}).join('')+'</div>'}
async function year(){
  const n=N[S.node],s=sat();
  for(const h of 'UD'){if(n[h].named&&n[h].tag)S.tags[n[h].who]=n[h].tag}
  const a=screen('',row()+'<div class="yr">'+n.year+'</div><div class="gh">'+tx(DATA.v5.grp)+(L?' (':'（')+(6-S.gone.length)+(L?')':'）')+'</div>'+
    '<div class="chat grp"></div><div class="memo fmemo"><i>'+nm('主管')+'</i><p>'+tx(n.ask[0])+'</p></div>',{sat:s});
  const box=a.querySelector('.chat');H.locked=true;
  if(S.pendingBaby){const b=S.pendingBaby;S.pendingBaby=null;box.insertAdjacentHTML('beforeend','<div class="bub babyb"><i>'+nm(b.z)+'</i><img src="img/baby_'+b.bw+'.webp" alt="">'+tx(DATA.v5.baby1).replace('{n}',b.n)+'</div>');await wait(800);const cg=DATA.class_.find(q=>q!==b.z&&q!=='老顏'&&!S.gone.includes(q));if(cg){box.insertAdjacentHTML('beforeend',bubHTML(cg,DATA.v5.baby2).replace('{who}',nm(b.z)));await wait(700)}}
  const lines=(DATA.group[S.node]||[]).filter(([w,t,d])=>!S.gone.includes(w)&&d.every(x=>x[0]==='!'?S.gone.includes(x.slice(1)):!S.gone.includes(x))).map(([w,t])=>[w,t]);
  await stream(box,lines,n.flood?380:700);await wait(400);a.querySelector('.fmemo').classList.add('in');await wait(600);H.locked=false;
  await tapNext(a);choice(n,s);
}
function fitH1(w){w.querySelectorAll('.half').forEach(h=>{const e=h.querySelector('.h1');const max=h.clientHeight*(L?.5:.42);
  let fs=Math.min(60,h.clientHeight*.2);e.style.fontSize=fs+'px';while((e.scrollHeight>max||e.scrollWidth>e.clientWidth+1)&&fs>16){fs-=2;e.style.fontSize=fs+'px'}
  e.style.webkitTextStroke=Math.max(3,Math.round(fs/10))+'px var(--hot)';h.style.setProperty('--h1h',e.scrollHeight+'px')})}
function choice(n,s){
  const half=h=>{const x=n[h],who=x.named?tagOf(x.who):tx(x.whoE);const show=h==='U'||!S.seenAside.includes(x.who)||n.final;
    return '<div class="half '+h+'"><img class="re" src="img/'+S.node+'_'+h+'_real.webp" alt=""><img class="po" src="img/'+S.node+'_'+h+'_poster.webp" alt="">'+
     '<div class="h1">'+tx(x.h1)+'</div><div class="sub">'+tx(x.sub)+'</div><div class="tag">'+who+'</div>'+(show?'<div class="aside hand">'+tx(x.aside_ring&&S.self<3?x.aside_ring:x.aside)+'</div>':'')+'</div>'};
  const askBar='<span class="cut">✂</span><span>'+tx(n.ask[1])+'</span>';
  const w=screen('wall',half('U')+half('D')+'<div class="bar">'+askBar+'</div>'+(S.node==='y2018'?'<div class="hint">'+tx(U.hint)+'</div>':''),{sat:s,bg:'img/'+S.node+'_U_poster.webp'});
  S.seenAside.push(n.D.who);requestAnimationFrame(()=>fitH1(w));
  let pick=null;
  w.pick=h=>{if(w.classList.contains('done'))return;pick=h;const o=h==='U'?'D':'U';
    w.querySelector('.half.'+h).className='half '+h+' on';w.querySelector('.half.'+o).className='half '+o+' off';
    w.querySelectorAll('.hint').forEach(e=>e.remove());
    w.querySelector('.bar').innerHTML='<span class="cut">✂</span><button>'+tx(U.pub)+'</button><span class="keys">Enter</span>';
    w.querySelector('.bar button').onclick=e=>{e.stopPropagation();w.commit()};bd.style.backgroundImage='url(img/'+S.node+'_'+h+'_poster.webp)'};
  w.commit=()=>{if(pick&&!w.classList.contains('done'))publish(w,n,pick,s)};
  w.addEventListener('click',e=>{const hf=e.target.closest('.half');if(hf)w.pick(hf.classList.contains('U')?'U':'D')}); // tap = select; 發布 = commit
}
async function snip(w,o){const RM=matchMedia('(prefers-reduced-motion: reduce)');const bar=w.querySelector('.bar');bar.querySelectorAll('button,.keys,.cut').forEach(e=>e.remove());
  if(!RM.matches){const y='calc(50% '+(o==='U'?'- 27px':'+ 27px')+')',sl=document.createElement('div'),sc=document.createElement('div');
    sl.className='slit';sc.className='snip';sc.innerHTML='<b>✂</b>';sl.style.top=sc.style.top=y;w.append(sl,sc);await wait(600);sc.remove()}
  const dr=w.querySelector('.half.'+o);dr.classList.add('drop');await wait(RM.matches?300:520);dr.style.display='none';w.querySelectorAll('.slit').forEach(e=>e.remove())}
// group chat after an upper half is published: classmates retell what outsiders said (no outsider forwards). k=1 stays, k=2 leaves.
async function groupCons(node,who,k){
  const ls=(DATA.gcons[node]||{})[k]||[];
  const f=screen('fb','<img class="fbbg" src="img/'+node+'_U_poster.webp" alt="">'+row(who)+'<div class="spacer"></div><div class="phone"></div><div class="spacer"></div><div class="tail"></div>',{sat:sat()});
  const ph=f.querySelector('.phone'),tail=f.querySelector('.tail');H.locked=true;
  ph.innerHTML='<div class="ph">'+tx(DATA.v5.grp)+(L?' (':'（')+(6-S.gone.length+(k>=2?1:0))+(L?')':'）')+'</div>';await wait(500);
  const nw=DATA.news&&DATA.news[node];
  if(nw){ph.insertAdjacentHTML('beforeend','<div class="news"><span>'+(L?'NEWS':'新聞')+'</span><b>'+tx(nw[0])+'</b><small>'+tx(nw[1])+'</small></div>');await wait(1300)}
  for(const [w,t,txt,d] of ls){if(w!==who&&S.gone.includes(w))continue;if(!d.every(x=>x===who||!S.gone.includes(x)))continue;
    ph.insertAdjacentHTML('beforeend','<div class="bub"><i>'+tagOf(w)+(t?'　'+t:'')+'</i>'+tx(txt)+'</div>');await wait(1100)}
  if(k>=2){ph.insertAdjacentHTML('beforeend','<div class="sysin">'+tx(DATA.open2.left).replace('{who}',nm(who))+'</div>');await wait(600)} // R4-2: LINE-style last line of the group card, not a bar over the tap pill
  H.locked=false;await tapNext(f);
}
function hurt(id,node){S.hurt[id]=(S.hurt[id]||0)+1;(S.cutIn[id]=S.cutIn[id]||[]).push(node);if(S.hurt[id]===2)S.gone.push(id);return S.hurt[id]}
async function publish(w,n,h,s){
  w.classList.add('done');const o=h==='U'?'D':'U';
  await snip(w,o);
  S.path.push({node:S.node,side:h});
  if(n.final){w.querySelector('.bar').innerHTML='';await wait(600);if(h==='U'){S.laoyanGray=true;const v=n.U.who;if(DATA.gcons[S.node]&&!S.gone.includes(v)){w.querySelector('.bar').innerHTML='<i class="tn">'+(L?'tap ›':'點一下 ›')+'</i>';await tapNext(w);await groupCons(S.node,v,hurt(v,S.node))}}else S.peishanGray=true;return reunion()}
  w.querySelector('.bar').innerHTML='<i>'+nm('主管')+'</i><span>'+(h==='U'?tx(DATA.v5.boss_ok):(L?'Rejected.':'退件。'))+'</span>';
  await wait(500);w.querySelector('.bar').insertAdjacentHTML('beforeend','<i class="tn">'+(L?'tap ›':'點一下 ›')+'</i>');await tapNext(w);
  let k=0,who=null;
  if(h==='U'){if(n.D.named&&!S.gone.includes(n.D.who)){who=n.D.who;k=hurt(who,S.node)}}else S.self++;
  if(h==='U'){if(who)await groupCons(S.node,who,k)}
  else{const f=screen('fb','<img class="fbbg" src="img/'+S.node+'_D_poster.webp" alt="">'+row('老顏')+'<div class="spacer"></div><div class="phone"></div><div class="spacer"></div><div class="tail"></div>',{sat:s});
    const ph=f.querySelector('.phone'),tail=f.querySelector('.tail');H.locked=true;
    ph.innerHTML='<div class="ph">'+nm('主管')+'</div>';await wait(500);
    ph.insertAdjacentHTML('beforeend','<div class="bub">'+tx(n.boss.D)+'</div>');await wait(1100);
    tail.innerHTML='<div class="life hand">'+(S.self===3?tx(DATA.ring_off):S.self<=4&&DATA.life[S.self-1][0]?tx(DATA.life[S.self-1]):tx(U.again_night))+'</div>';
    H.locked=false;await tapNext(f)}
  S.step++;
  if(S.babies.includes(S.step)){S.baby++;let j=S.baby-2,bw,z;for(let t=0;t<DATA.babies.length;t++){bw=DATA.babies[(j+t)%DATA.babies.length];z=Object.keys(DATA.slug).find(q=>DATA.slug[q]===bw);if(!S.gone.includes(z))break}S.pendingBaby={n:S.baby,bw,z}}
  S.node=n.next[h];year();
}
// ---------- reunion ----------
function rkey(m){return m+'|'+S.cutIn[m].slice(0,2).sort().join(',')} // 志豪 etc: only the first two cuts have a key
async function reunion(){
  const V=DATA.v5,gray=m=>(m==='老顏'&&S.laoyanGray)||(m==='佩珊'&&S.peishanGray);
  const ph=screen('','<img class="full" src="img/pingxi_2026.webp" alt=""><div class="ttl hand">'+tx(V.reu26)+'</div><div class="wish hand l26"></div>'+
    '<div class="lan">'+DATA.class_.map(m=>'<div class="mate'+(S.gone.includes(m)?' empty':gray(m)?' g':'')+'" data-m="'+m+'"><div class="lamp"'+(S.gone.includes(m)?' style="opacity:.25;filter:grayscale(1);transform:translateY(40%)"':'')+'>'+nm(m)+'</div><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><span>'+nm(m)+'</span></div>').join('')+'</div>',{bg:'img/pingxi_2026.webp'});
  const wb=ph.querySelector('.wish');H.locked=true;await wait(1200);
  for(const m of DATA.class_){const el=ph.querySelector('[data-m="'+m+'"]');let t;
    if(S.gone.includes(m)){wb.style.filter='grayscale(1)';wb.style.opacity=.7;wb.innerHTML='<i>'+nm(m)+'　'+tx(V.left26)+'</i>'+tx(DATA.wish[m]);await wait(1500);wb.style.filter='';wb.style.opacity='';continue}
    if(m==='老顏'){const i=S.self>=3?2:(S.self+(S.laoyanGray?1:0))>=1?1:0;t=DATA.lao26[i][0]?tx(DATA.lao26[i]):tx(V.blank)}
    else t=tx(DATA.wish26[m][(m==='佩珊'?S.peishanGray:(S.hurt[m]||0)>0)?1:0]);
    el.classList.add('seen');wb.innerHTML='<i>'+nm(m)+'</i>'+t;await wait(2300)}
  ph.querySelector('.lan').classList.add('fly');await wait(2200);
  const g=S.gone.length,v=g>=2?'gone':(S.self>=3&&!g?'self':'mix');
  wb.innerHTML='<b>'+tx(DATA.verdict[v])+'</b><br><small>'+tx(V.kids26).replace('{n}',S.baby)+(S.self?'　'+tx(V.redo).replace('{n}',S.self):'')+'</small>';
  H.locked=false;await tapNext(ph);
  const dms=[...S.gone,...DATA.class_.filter(m=>m!=='老顏'&&!S.gone.includes(m)&&(S.hurt[m]||0)===1)];
  for(const m of dms){const r=DATA.reunion[rkey(m)];if(!r||!r.line[0])continue;const cold=S.gone.includes(m);const Q=['家豪','志豪'].includes(m)?U.q:(U.qf||U.q);
    const p=screen('','<div class="who"><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><b>'+tagOf(m)+'</b></div><div class="chat dmc" style="-webkit-mask:none;mask:none;justify-content:flex-start">'+bubHTML(m,r.line,cold)+'</div><div class="qs">'+Q.map((q,i)=>'<button data-i="'+i+'">'+tx(q)+'</button>').join('')+'</div>');
    const box=p.querySelector('.chat');
    p.querySelectorAll('.qs button').forEach(b=>b.onclick=e=>{e.stopPropagation();p.querySelectorAll('.qs button').forEach(x=>x.disabled=false);b.disabled=true;
      box.innerHTML='<div class="bub'+(cold?' gone':'')+'"><i>'+tagOf(m)+'</i><span class="clamp">'+tx(r.line)+'</span></div>'+'<div class="bub" style="align-self:flex-end;background:#F3ECE9">'+tx(Q[+b.dataset.i])+'</div>'+bubHTML(m,r.qa[+b.dataset.i],cold)});
    await tapNext(p)}
  const srcs=[...new Set(S.path.map(p=>N[p.node].year+'　'+N[p.node].src))];
  const z=screen('','<div class="yr" style="font-size:calc(3*var(--u))">'+tx(U.src)+'</div><div class="src">'+srcs.join('<br>')+'</div><div class="credit">'+tx(U.credit)+'</div><button class="btn">'+tx(U.again)+'</button>');
  z.querySelector('button').onclick=()=>location.reload();S.ended=true;
}
function title(){
  const t=screen('title','<h1>'+tx(U.title)+'</h1><button class="btn" style="margin-top:4vh">'+(L?'Start':'開始')+'</button>',{bg:'img/y2018_U_poster.webp'});
  t.querySelector('button').onclick=()=>{document.getElementById('lang').remove();opening()};
}
document.getElementById('lang').onclick=e=>{e.stopPropagation();L=1-L;e.target.textContent=L?'中文':'EN';deck.innerHTML='';H.list=[];title()};
if(/en/i.test(navigator.language)&&!/zh/i.test(navigator.language)){L=1;document.getElementById('lang').textContent='中文'}
title();
</script></body></html>
