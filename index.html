<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Baby or Bust｜我們這一班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Poster";src:url(poster.woff2) format("woff2");font-weight:900;font-display:block}
:root{--pink:#E8A9B0;--hot:#D6336C;--paper:#F3ECE9;--ink:#3A3434;--night:#2F3B52;--memo:#FFF3B0;
 --vh:100dvh;--sw:min(100vw,calc(var(--vh)*.62));--u:calc(var(--vh)/100)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);overscroll-behavior:none}
body{color:var(--ink);font-family:"Huninn","Noto Sans CJK TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.hand{font-family:"LXGW WenKai TC","Noto Serif CJK TC",serif}
/* backdrop for landscape / wide screens */
#bd{position:fixed;inset:-40px;background:center/cover no-repeat;filter:blur(28px) saturate(.6) brightness(.55);transition:background-image .6s}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--sw);height:var(--vh);overflow:hidden;background:var(--night)}
@media (min-aspect-ratio:7/10){#stage{box-shadow:0 0 60px #0009}}
#deck{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
 padding:calc(env(safe-area-inset-top) + 3.2*var(--u)) 5% calc(env(safe-area-inset-bottom) + 3*var(--u));gap:calc(1.6*var(--u));
 transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .45s;background:var(--night)}
.scr.below{transform:translateY(100%)}.scr.above{transform:translateY(-30%);opacity:0;pointer-events:none}
.yr{color:var(--paper);font-size:calc(4.6*var(--u));letter-spacing:3px;font-weight:bold;text-align:center}
.bub{align-self:flex-start;background:#fff;border-radius:14px;padding:calc(.9*var(--u)) 12px;font-size:clamp(13px,calc(2.25*var(--u)),17px);line-height:1.4;max-width:88%;animation:in .35s both}
.bub i{display:block;font-style:normal;font-size:.78em;color:#8a8080}
.bub.gone{filter:grayscale(1);opacity:.62}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.memo{background:var(--memo);border-radius:12px;padding:calc(1.4*var(--u)) 16px;box-shadow:0 3px 0 #0003}
.memo i{display:block;font-style:normal;font-size:clamp(11px,calc(1.8*var(--u)),14px);color:#8a7a40;margin-bottom:2px}
.memo p{font-size:clamp(15px,calc(2.6*var(--u)),20px);line-height:1.45;font-weight:bold}
.memo p+p{font-weight:normal}
.chat.calm{justify-content:flex-start;-webkit-mask:none;mask:none}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:calc(1.1*var(--u));overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 22%);mask:linear-gradient(transparent,#000 22%)}
.tapnext{align-self:center;color:#F3ECE9aa;font-size:13px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
/* choice wall */
.scr.wall{padding:0;gap:0}
.half{position:absolute;left:0;right:0;height:calc(50% - 26px);overflow:hidden;background:#ccc}
.half.U{top:0}.half.D{bottom:0}
.half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s,filter .35s}
.half .po{opacity:0}.half .re{filter:saturate(.55)}
.half.on .po{opacity:1}.half.on .re{opacity:0}
.half.off .re{filter:grayscale(1) brightness(1.04)}
.h1{position:absolute;left:0;right:0;top:10%;text-align:center;font-family:"Poster",sans-serif;font-weight:900;color:#fff;-webkit-text-stroke:5px var(--hot);paint-order:stroke fill;line-height:1.06;padding:0 10px;opacity:0;transition:opacity .3s}
.sub{position:absolute;left:50%;transform:translateX(-50%);top:calc(10% + var(--h1h,52px) + 6px);max-width:92%;text-align:center;line-height:1.25;background:var(--hot);color:#fff;font-family:"Poster",sans-serif;font-weight:900;font-size:clamp(12px,calc(2.1*var(--u)),16px);border-radius:16px;padding:4px 14px;opacity:0;transition:opacity .3s}
.half.on .h1,.half.on .sub{opacity:1}
.tag{position:absolute;left:10px;bottom:10px;background:#fffd;border-radius:16px;padding:3px 12px;font-size:clamp(12px,calc(2*var(--u)),15px);font-weight:bold;z-index:2}
.U .tag{top:calc(env(safe-area-inset-top) + 10px);bottom:auto}
.aside{position:absolute;right:10px;bottom:10px;max-width:60%;background:#3A3434e6;color:var(--paper);border-radius:6px;padding:4px 10px;font-size:clamp(12px,calc(2*var(--u)),15px);z-index:2;transition:opacity .3s}
.U .aside{top:calc(env(safe-area-inset-top) + 10px);bottom:auto}
.half.on .aside{opacity:0}
.bar{position:absolute;left:0;right:0;top:calc(50% - 26px);height:52px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--memo);padding:0 12px;z-index:3;font-weight:bold;font-size:clamp(13px,calc(2.3*var(--u)),17px);line-height:1.25;text-align:center}
.bar i{font-style:normal;font-weight:normal;font-size:.8em;color:#8a7a40}
.bar button{border:0;border-radius:20px;padding:8px 22px;font:inherit;background:var(--ink);color:var(--paper)}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#1E2638ee;color:var(--paper);border-radius:18px;padding:12px 18px;font-size:15px;text-align:center;line-height:1.6;pointer-events:none}
.hint b{display:block;font-size:26px;animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
.keys{display:none;font-size:12px;color:#8a7a40;font-weight:normal}
@media (hover:hover) and (pointer:fine){.keys{display:inline}}
/* feedback */
.scr.fb{justify-content:flex-end}
.fbbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.45) saturate(.8)}
.fb>*:not(.fbbg){position:relative}
.note{align-self:flex-end;background:var(--memo);padding:8px 12px;font-size:clamp(14px,calc(2.3*var(--u)),18px);transform:rotate(1.5deg);box-shadow:0 2px 4px #0004;max-width:82%}
.note i{font-style:normal;font-size:.75em;color:#8a7a40;margin-right:6px}
.life{align-self:center;width:80%;background:#e2dedc;padding:12px;font-size:clamp(14px,calc(2.3*var(--u)),18px);line-height:1.5;text-align:center;transform:rotate(-1deg);box-shadow:0 3px 8px #0006}
/* photo screens */
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:relative;margin-top:auto;background:#F3ECE9ee;border-radius:10px;padding:calc(1.4*var(--u)) 14px;font-size:clamp(15px,calc(2.5*var(--u)),19px);line-height:1.5;text-align:center}
.btn{border:0;border-radius:22px;padding:10px 30px;font:inherit;font-size:17px;font-weight:bold;background:var(--pink);color:var(--ink);align-self:center;position:relative}
.baby{align-self:center;width:min(78%,calc(48*var(--u)));background:#fff;padding:8px 8px 12px;transform:rotate(-1.5deg);box-shadow:0 3px 10px #0007;margin:auto 0}
.baby img{width:100%;display:block}.baby p{font-size:clamp(14px,calc(2.3*var(--u)),18px);margin-top:6px;text-align:center}
.group{position:absolute;left:0;right:0;bottom:12%;height:38%;display:flex;justify-content:center;align-items:flex-end;gap:1%}
.mate{position:relative;height:100%;width:15%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform 1.6s ease-in,opacity 1.6s ease-in}
.mate img{max-height:88%;max-width:100%;filter:drop-shadow(0 2px 4px #0006)}
.mate span{font-size:clamp(10px,calc(1.7*var(--u)),13px);background:#fffc;border-radius:8px;padding:0 6px;margin-top:2px}
.mate.g img{filter:grayscale(1);opacity:.6}
.mate.walk{transform:translateX(70vw);opacity:0}
.mate.empty img{visibility:hidden}.mate.empty{outline:2px dashed #fff9;outline-offset:-2px;border-radius:10px}.mate.empty span{opacity:.5}
.who{display:flex;align-items:center;gap:10px;color:var(--paper)}
.who img{height:calc(14*var(--u));filter:grayscale(1);background:#e2dedc;border-radius:12px}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs button{border:1px solid #b9b2b0;background:transparent;color:var(--paper);border-radius:14px;padding:5px 11px;font:inherit;font-size:clamp(12px,calc(2*var(--u)),15px)}
.qs button:disabled{opacity:.35}
.line{color:var(--paper);font-size:clamp(15px,calc(2.5*var(--u)),19px);line-height:1.6;text-align:center}
.verdict{color:var(--paper);font-size:clamp(20px,calc(3.6*var(--u)),30px);font-weight:bold;text-align:center;line-height:1.4}
.src{color:#b9b4b2;font-size:clamp(11px,calc(1.75*var(--u)),13px);line-height:1.65;overflow:auto;flex:1;min-height:0}
.credit{color:#8f8a88;font-size:11px;line-height:1.6;text-align:center}
.title{justify-content:center;align-items:center;color:var(--paper);text-align:center}
.title h1{font-family:"Poster",sans-serif;font-size:calc(6.4*var(--u));-webkit-text-stroke:5px var(--hot);paint-order:stroke fill;color:#fff}
.lang{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:9;border:0;border-radius:14px;padding:4px 10px;font:inherit;font-size:13px;background:#F3ECE9cc}
.spacer{flex:1}
.lan{position:absolute;left:0;right:0;bottom:10%;height:52%;display:flex;justify-content:center;align-items:flex-end;gap:1%}
.lan .mate{cursor:pointer}
.lamp{width:78%;aspect-ratio:3/4;margin-bottom:4px;border-radius:40% 40% 18% 18%;background:linear-gradient(#fff7d6,#f6d58a);transition:transform 2.6s ease-in,box-shadow .4s,opacity 2.6s;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,calc(1.6*var(--u)),13px);color:#a0743a}
.mate.seen .lamp{box-shadow:0 0 18px #ffd27a,0 0 4px #fff;background:linear-gradient(#fffbe8,#ffcf6b)}
.lan.fly .lamp{transform:translateY(-120vh);opacity:.2}
.wish{position:relative;background:#fffbe8;border-radius:6px;padding:calc(1.4*var(--u)) 14px;font-size:clamp(15px,calc(2.6*var(--u)),20px);line-height:1.5;box-shadow:0 3px 10px #0007;min-height:calc(13*var(--u))}
.wish i{display:block;font-style:normal;font-size:.72em;color:#a0743a}
.ttl{color:var(--paper);font-size:clamp(15px,calc(2.6*var(--u)),20px);text-align:center;position:relative;text-shadow:0 1px 4px #000}
.call{justify-content:center;align-items:center;text-align:center;color:var(--paper);background:#111827}
.call img{height:calc(22*var(--u));border-radius:50%;background:#e2dedc;object-fit:cover;object-position:top;aspect-ratio:1}
.call .ring{font-size:clamp(14px,calc(2.3*var(--u)),18px);color:#9ae6b4;animation:blink 1s infinite}
.call .sub2{font-size:clamp(16px,calc(2.7*var(--u)),21px);line-height:1.6;animation:in .4s both}
.sys{align-self:center;color:#b9b4b2;font-size:clamp(13px,calc(2.1*var(--u)),16px);background:#0005;border-radius:12px;padding:4px 12px}
.mate .float{position:absolute;bottom:30%;left:-30%;right:-30%;font-size:clamp(9px,calc(1.45*var(--u)),12px);line-height:1.35;color:#fff;text-shadow:0 1px 3px #000;text-align:center}
.mate .glow{width:60%;aspect-ratio:3/4;border-radius:40% 40% 18% 18%;background:linear-gradient(#fffbe8,#ffcf6b);box-shadow:0 0 16px #ffd27a;margin-bottom:4px;animation:rise 3s ease-out both}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
</style>
</head>
<body>
<div id="bd"></div>
<div id="stage"><button id="lang" class="lang">EN</button><div id="deck"></div></div>
<script>document.write('<script src="data.js?v=20261027d&t='+Date.now()+'"><\/script>')</script>
<script>
// Baby or Bust — 我們這一班. One screen per beat; written during the Meta hackathon (2026-10-27). Spec: docs/spec/.
const V='20261027d';if(!DATA.callN&&!/reload=/.test(location.search))location.replace(location.pathname+'?reload='+Date.now());
const bust=h=>h.replace(/(img\/\w+\.webp)/g,'$1?v='+V);
const N=DATA.nodes,U=DATA.ui;let L=0;
const tx=a=>Array.isArray(a)?(a[L]||a[0]):(a||'');
const nm=w=>L?(DATA.names[w]||w):w;
const S={node:'y2018',self:0,gone:[],hurt:{},peishanGray:false,cutIn:{},seenAside:[],laoyanGray:false,path:[],step:0,tags:{},babies:[],baby:1};
const deck=document.getElementById('deck'),bd=document.getElementById('bd');
const SAT=[1,.88,.76,.66,.58,.5,.44];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const sat=()=>SAT[Math.min(S.step,SAT.length-1)];
// ---------- deck: one screen at a time; back = review only ----------
const H={list:[],i:-1,next:null,locked:false};
function screen(cls,html,opt={}){
  const d=document.createElement('div');d.className='scr '+cls+' below';d.innerHTML=bust(html);
  if(opt.sat&&opt.sat<1)d.style.filter='saturate('+opt.sat+')';
  deck.appendChild(d);H.list.push(d);go(H.list.length-1);
  if(opt.bg)bd.style.backgroundImage='url('+bust(opt.bg)+')';
  return d}
function go(i){H.list.forEach((s,k)=>{s.classList.toggle('below',k>i);s.classList.toggle('above',k<i)});H.i=i}
function tapNext(scr,label){const t=document.createElement('div');t.className='tapnext';t.textContent=label||(L?'tap to continue':'點一下繼續');scr.appendChild(t);
  return new Promise(r=>{H.next=()=>{t.remove();H.next=null;r()}})}
function forward(){if(H.i<H.list.length-1)go(H.i+1);else if(H.next&&!H.locked)H.next()}
function back(){if(H.i>0)go(H.i-1)}
const cur=()=>H.list[H.i];
deck.addEventListener('click',e=>{if(e.target.closest('button,.wall'))return;forward()});
let ty=null;deck.addEventListener('pointerdown',e=>{ty=e.clientY});
deck.addEventListener('pointerup',e=>{if(ty===null)return;const dy=e.clientY-ty;ty=null;if(cur()&&cur().classList.contains('wall')&&!cur().classList.contains('done'))return;
  if(dy>50)back();else if(dy<-50)forward()});
let wheelT=0;addEventListener('wheel',e=>{const now=Date.now();if(now-wheelT<600||Math.abs(e.deltaY)<20)return;wheelT=now;
  const c=cur();if(c&&c.classList.contains('wall')&&!c.classList.contains('done')){c.pick(e.deltaY>0?'D':'U');return}
  e.deltaY>0?forward():back()},{passive:true});
addEventListener('keydown',e=>{const c=cur();const live=c&&c.classList.contains('wall')&&!c.classList.contains('done');
  if(live){if(e.key==='ArrowUp')c.pick('D');else if(e.key==='ArrowDown')c.pick('U');else if(e.key==='Enter'||e.key===' ')c.commit&&c.commit();return}
  if(['ArrowDown','PageDown',' ','Enter','ArrowRight'].includes(e.key)){e.preventDefault();forward()}else if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key))back()});
// ---------- helpers ----------
function tagOf(w){const t=S.tags[w]||DATA.tag[w];return t?nm(w)+(L?' (':'（')+tx(t)+(L?')':'）'):nm(w)}
function bubHTML(w,t,gone){return '<div class="bub'+(gone?' gone':'')+'"><i>'+tagOf(w)+'</i>'+tx(t)+'</div>'}
async function stream(box,items,gap){for(const [w,t] of items){box.insertAdjacentHTML('beforeend',bubHTML(w,t,S.gone.includes(w)));await wait(gap)}}
// ---------- opening (C9) ----------
async function opening(){
  const O=DATA.open2,seen=new Set();
  const a=screen('','<img class="full" src="img/pingxi_2018.webp" alt=""><div class="ttl hand">'+tx(O.title)+'</div><div class="wish hand"><i></i>'+tx(O.lead)+'<br><small style="color:#a0743a">'+tx(O.tapl)+'</small></div>'+
    '<div class="lan">'+DATA.class_.map(m=>'<div class="mate" data-m="'+m+'"><div class="lamp">'+nm(m)+'</div><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><span>'+nm(m)+'</span></div>').join('')+'</div>',{bg:'img/pingxi_2018.webp'});
  const wb=a.querySelector('.wish');H.locked=true;
  await new Promise(r=>a.querySelectorAll('.lan .mate').forEach(el=>el.onclick=e=>{e.stopPropagation();const m=el.dataset.m;seen.add(m);el.classList.add('seen');
    wb.innerHTML='<i>'+nm(m)+'</i>'+tx(DATA.wish[m]);
    if(seen.size===6&&!a.querySelector('.btn')){a.insertAdjacentHTML('beforeend','<button class="btn" style="position:absolute;bottom:3%;left:50%;transform:translateX(-50%)">'+tx(O.fly)+'</button>');a.querySelector('.btn').onclick=e2=>{e2.stopPropagation();r()}}}));
  a.querySelector('.btn').remove();a.querySelectorAll('.lan .mate').forEach(el=>{el.onclick=null;el.style.pointerEvents='none'});a.querySelector('.lan').classList.add('fly');await wait(2200);
  wb.innerHTML=tx(O.promise);H.locked=false;await tapNext(a);
  const c=screen('','<img class="full" src="img/desk_day1.webp" alt=""><div class="ttl hand">'+tx(O.day1)+'</div><div class="memo" style="position:relative"><i>'+nm('主管')+'</i><p>'+tx(O.boss1)+'</p><p>'+tx(O.boss2)+'</p></div><div class="spacer"></div><div class="note hand" style="position:relative">'+tx(O.ledger)+'</div><button class="btn">'+tx(U.start)+'</button>',{bg:'img/desk_day1.webp'});
  await new Promise(r=>c.querySelector('button').onclick=e=>{e.stopPropagation();r()});
  S.babies=[1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*5));
  year();
}
async function phoneCall(m){
  const p=screen('call','<img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><b style="font-size:calc(3.2*var(--u))">'+nm(m)+'</b><div class="ring">'+tx(DATA.open2.calling)+'</div><div class="lines" style="display:flex;flex-direction:column;gap:calc(1.2*var(--u));min-height:calc(18*var(--u))"></div>');
  await tapNext(p,L?'tap to answer':'點一下接聽');p.querySelector('.ring').remove();
  H.locked=true;const box=p.querySelector('.lines');for(const l of ((DATA.callN&&DATA.callN[S.node])||DATA.call[m])){box.insertAdjacentHTML('beforeend','<div class="sub2 hand">'+tx(l)+'</div>');await wait(1500)}
  H.locked=false;await tapNext(p);
}
async function leftGroup(m){
  const p=screen('','<div class="spacer"></div><img src="img/fb_'+DATA.slug[m]+'.webp" alt="" style="align-self:center;height:calc(36*var(--u));filter:grayscale(1);opacity:.55;"><div class="sys">'+tx(DATA.open2.left).replace('{who}',nm(m))+'</div><div class="spacer"></div>');
  await tapNext(p);
}
// ---------- a year: interstitial → choice → feedback ----------
async function year(){
  const n=N[S.node],s=sat();
  for(const h of 'UD'){if(n[h].named&&n[h].tag)S.tags[n[h].who]=n[h].tag}
  const a=screen('','<div class="yr">'+n.year+'</div>'+(n.year===2019?'<div class="life hand">'+tx(U.obj19)+'</div>':'')+
    '<div class="memo"><i>'+nm('主管')+'</i><p>'+tx(n.ask[0])+'</p><p>'+tx(n.ask[1])+'</p></div><div class="chat'+(n.flood?'':' calm')+'"></div>',{sat:s});
  await stream(a.querySelector('.chat'),n.setup.filter(([w])=>!S.gone.includes(w)),n.flood?280:600);await tapNext(a);
  choice(n,s);
}
function fitH1(w){w.querySelectorAll('.half').forEach(h=>{const e=h.querySelector('.h1');const max=h.clientHeight*(L?.5:.42);
  let fs=Math.min(60,h.clientHeight*.2);e.style.fontSize=fs+'px';while((e.scrollHeight>max||e.scrollWidth>e.clientWidth+1)&&fs>16){fs-=2;e.style.fontSize=fs+'px'}
  e.style.webkitTextStroke=Math.max(3,Math.round(fs/10))+'px var(--hot)';h.style.setProperty('--h1h',e.scrollHeight+'px')})}
function choice(n,s){
  const half=h=>{const x=n[h],who=x.named?tagOf(x.who):tx(x.whoE);const show=h==='U'||!S.seenAside.includes(x.who)||n.final;
    return '<div class="half '+h+'"><img class="re" src="img/'+S.node+'_'+h+'_real.webp" alt=""><img class="po" src="img/'+S.node+'_'+h+'_poster.webp" alt="">'+
     '<div class="h1">'+tx(x.h1)+'</div><div class="sub">'+tx(x.sub)+'</div><div class="tag">'+who+'</div>'+(show?'<div class="aside hand">'+tx(x.aside_ring&&S.self<3?x.aside_ring:x.aside)+'</div>':'')+'</div>'};
  const askBar='<span>'+tx(n.ask[1])+'</span>';
  const w=screen('wall',half('U')+half('D')+'<div class="bar">'+askBar+'</div>'+(S.step===0?'<div class="hint"><b>⇅</b>'+tx(U.hint)+'<br><small>'+tx(U.hint_up)+'　'+tx(U.hint_down)+'</small></div>':''),{sat:s,bg:'img/'+S.node+'_U_poster.webp'});
  S.seenAside.push(n.D.who);requestAnimationFrame(()=>fitH1(w));
  let y0=null,x0=null,pick=null;
  w.pick=h=>{if(w.classList.contains('done'))return;pick=h;const o=h==='U'?'D':'U';
    w.querySelector('.half.'+h).className='half '+h+' on';w.querySelector('.half.'+o).className='half '+o+' off';
    w.querySelectorAll('.hint').forEach(e=>e.remove());
    w.querySelector('.bar').innerHTML='<i>'+tx(h==='D'?U.hint_up:U.hint_down)+'</i><button>'+tx(U.pub)+'</button><span class="keys">Enter</span>';
    w.querySelector('.bar button').onclick=e=>{e.stopPropagation();w.commit()};bd.style.backgroundImage='url(img/'+S.node+'_'+h+'_poster.webp)'};
  w.commit=()=>{if(pick&&!w.classList.contains('done'))publish(w,n,pick,s)};
  w.addEventListener('pointerdown',e=>{y0=e.clientY;x0=e.clientX});
  w.addEventListener('pointerup',e=>{if(y0===null||e.target.closest('button'))return;const dy=e.clientY-y0,dx=e.clientX-x0;y0=null;
    if(Math.abs(dy)>36&&Math.abs(dy)>Math.abs(dx))w.pick(dy<0?'D':'U'); // push away the half you don't keep
    else if(Math.abs(dy)<10&&Math.abs(dx)<10){const r=w.getBoundingClientRect();w.pick(e.clientY-r.top<r.height/2?'U':'D')}});
  w.addEventListener('pointercancel',()=>{y0=null});
}
function hurt(id,node){S.hurt[id]=(S.hurt[id]||0)+1;(S.cutIn[id]=S.cutIn[id]||[]).push(node);if(S.hurt[id]===2)S.gone.push(id);return S.hurt[id]}
async function publish(w,n,h,s){
  w.classList.add('done');const o=h==='U'?'D':'U';
  w.querySelector('.half.'+o).style.filter='grayscale(1)';w.querySelector('.half.'+o).style.opacity=.5;w.querySelector('.bar').innerHTML='';
  S.path.push({node:S.node,side:h});await wait(450);
  if(n.final){if(h==='U')S.laoyanGray=true;else S.peishanGray=true;return reunion()}
  let k=0,who=null;
  if(h==='U'){if(n.D.named&&!S.gone.includes(n.D.who)){who=n.D.who;k=hurt(who,S.node)}}else S.self++;
  if(h==='D'&&S.self===3){const r=screen('fb','<img class="fbbg" src="img/ring_off.webp" alt="" style="filter:brightness(.85)"><div class="spacer"></div><div class="life hand">'+tx(DATA.ring_off)+'</div>',{sat:s,bg:'img/ring_off.webp'});await tapNext(r)}
  else{
    const c=n.chat[h];
    const f=screen('fb','<img class="fbbg" src="img/'+S.node+'_'+h+'_poster.webp" alt="">',{sat:s});
    await wait(350);f.insertAdjacentHTML('beforeend','<div class="note hand"><i>'+nm('主管')+'</i>'+tx(n.boss[h])+'</div>');
    if(c&&!S.gone.includes(c[0])&&k!==2){await wait(600);f.insertAdjacentHTML('beforeend',bubHTML(c[0],c[1],false))}
    if(h==='D'){await wait(600);f.insertAdjacentHTML('beforeend','<div class="life hand">'+(S.self<=4?tx(DATA.life[S.self-1]):tx(U.again_night))+'</div>')}
    await tapNext(f);
  }
  if(k===1)await phoneCall(who);else if(k===2)await leftGroup(who);
  S.step++;
  if(S.babies.includes(S.step)){S.baby++;const bw=DATA.babies[(S.baby-2)%DATA.babies.length];const z=Object.keys(DATA.slug).find(q=>DATA.slug[q]===bw);
    const b=screen('','<div class="baby"><img src="img/baby_'+bw+'.webp" alt=""><p>'+tx(U.baby).replace('{n}',S.baby).replace('{who}',nm(z))+'</p></div>',{sat:sat()});await tapNext(b)}
  S.node=n.next[h];year();
}
// ---------- reunion ----------
function rkey(m){return m+'|'+S.cutIn[m].slice().sort().join(',')}
async function reunion(){
  const a=screen('','<div class="spacer"></div><div class="yr">'+tx(DATA.open2.reu)+'</div><div class="memo"><p>'+tx(U.end)+'</p></div><div class="spacer"></div>',{bg:'img/pingxi_2026.webp'});await tapNext(a);
  const ph=screen('','<img class="full" src="img/pingxi_2026.webp" alt=""><div class="group">'+DATA.class_.map(m=>'<div class="mate'+((S.gone.includes(m)||(m==='老顏'&&S.laoyanGray)||(m==='佩珊'&&S.peishanGray))?' g':'')+'" data-m="'+m+'"><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><span>'+nm(m)+'</span></div>').join('')+'</div>');
  H.locked=true;await wait(1400);
  for(const m of S.gone){const el=ph.querySelector('[data-m="'+m+'"]');el.classList.add('walk');await wait(1700);el.classList.remove('walk','g');el.classList.add('empty');await wait(300)}
  for(const el of ph.querySelectorAll('.mate:not(.empty)'))el.insertAdjacentHTML('afterbegin','<div class="glow"></div>');
  if(S.gone.length)ph.insertAdjacentHTML('beforeend','<div class="wish hand" style="min-height:0;position:relative;opacity:.82;filter:grayscale(1)">'+S.gone.map(m=>'<i>'+nm(m)+'</i>'+tx(DATA.wish[m])).join('')+'</div>');await wait(1200);
  H.locked=false;await tapNext(ph);
  // verdict first (G4)
  const v=S.self>=3?'self':(S.gone.length>=2?'gone':'mix');
  const vs=screen('','<div class="spacer"></div><div class="verdict">'+tx(DATA.verdict[v])+'</div><div class="spacer"></div>');await tapNext(vs);
  for(const m of S.gone){const r=DATA.reunion[rkey(m)];if(!r)continue;
    const p=screen('','<div class="who"><img src="img/fb_'+DATA.slug[m]+'.webp" alt=""><b>'+tagOf(m)+'</b></div><div class="chat" style="-webkit-mask:none;mask:none;justify-content:flex-start">'+bubHTML(m,r.line,true)+'</div><div class="qs">'+U.q.map((q,i)=>'<button data-i="'+i+'">'+tx(q)+'</button>').join('')+'</div>');
    const box=p.querySelector('.chat');
    p.querySelectorAll('.qs button').forEach(b=>b.onclick=e=>{e.stopPropagation();p.querySelectorAll('.qs button').forEach(x=>x.disabled=false);b.disabled=true;
      box.innerHTML=bubHTML(m,r.line,true)+'<div class="bub" style="align-self:flex-end;background:#F3ECE9">'+tx(U.q[+b.dataset.i])+'</div>'+bubHTML(m,r.qa[+b.dataset.i],true)});
    await tapNext(p)}
  const tier=S.self>=3?'3+':S.self>=1?'1':'0';const me=DATA.self[tier+(S.laoyanGray?'|gray':'')];
  const e=screen('','<div class="spacer"></div><div class="line hand">'+tx(me).replace('{n}',S.self)+'</div><div class="spacer"></div>'+bubHTML('阿芳',[U.kids[0].replace('{n}',S.baby),U.kids[1].replace('{n}',S.baby)])+'<div class="spacer"></div>');await tapNext(e);
  const srcs=[...new Set(S.path.map(p=>N[p.node].year+'　'+N[p.node].src))];
  const z=screen('','<div class="yr" style="font-size:calc(3*var(--u))">'+tx(U.src)+'</div><div class="src">'+srcs.join('<br>')+'<br>2026　行政院 2026-05</div><div class="credit">'+tx(U.credit)+'</div><button class="btn">'+tx(U.again)+'</button>');
  z.querySelector('button').onclick=()=>location.reload();S.ended=true;
}
function title(){
  const t=screen('title','<h1>'+tx(U.title)+'</h1><button class="btn" style="margin-top:4vh">'+(L?'Start':'開始')+'</button>',{bg:'img/y2018_U_poster.webp'});
  t.querySelector('button').onclick=()=>{document.getElementById('lang').remove();opening()};
}
document.getElementById('lang').onclick=e=>{e.stopPropagation();L=1-L;e.target.textContent=L?'中文':'EN';deck.innerHTML='';H.list=[];title()};
if(/en/i.test(navigator.language)&&!/zh/i.test(navigator.language)){L=1;document.getElementById('lang').textContent='中文'}
title();
</script></body></html>
