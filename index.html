  const advL=(node,side)=>{const a=((SD.nadv||{})[node]||{})[side]||[];return a.length?a.map(id=>{const c=C[id];return c?'<div class="spfact adv">'+esc(tx(c.f[0]))+'</div>'+links(c):''}).join(''):'<div class="spnone">'+u('advNone')+'</div>'};
  const advH=(node,side)=>{if(!SD.nadv)return '';const o=side==='U'?'D':'U';return '<div class="spadv"><div class="spct">'+u('advH')+'</div>'+advL(node,side)+'<div class="spct">'+u('advOther',{h:(L?'“':'「')+tx(N[node][o].h1)+(L?'”':'」')})+'</div>'+advL(node,o)+'</div>'};
  const keptH=S.path.map(({node,side},i)=>{const n=N[node];return '<div class="spbox spk" data-i="'+i+'"><button type="button" aria-expanded="false"><span class="spy">'+n.year+'</span><span class="spt">'+esc(tx(n[side].h1))+'</span><span class="splab '+side+'">'+u(side)+'</span><span class="spch">›</span></button>'+
    '<div class="spkb">'+(SD.ncard[node]||[]).map(id=>{const c=C[id];return '<div class="spct">'+esc(tx(c.t))+'</div>'+c.f.map(f=>'<div class="spfact '+c.kind+'">'+esc(tx(f))+'</div>').join('')+links(c)}).join('')+advH(node,side)+'</div></div>'}).join('');
  const progH=SD.prog.map(([p,st])=>{const f=fact(p);return '<div class="spbox spp"><div class="spct" style="margin-top:0"><span class="splab P">'+esc(tx(st))+'</span> '+esc(tx(f.c.t))+'</div>'+factH(p)+'</div>'}).join('');
  const live=!!ASK_URL;
  const z=screen('sp','<div class="spb" tabindex="-1"><h2>'+u('title')+'</h2><div class="splead">'+u('lead')+'</div>'+
    '<div class="spf00">'+C.F00.f.map(f=>'<p>'+esc(tx(f))+'</p>').join('')+'</div>'+
    '<h3>'+u('quizH')+'</h3>'+quizH+
    '<h3 id="spask">'+u('askH')+'</h3><div class="spsub">'+u('askSub')+'</div><div class="spask">'+
      (live?'<div class="sprow"><input type="text" maxlength="40" enterkeyhint="search" autocomplete="off" placeholder="'+u('ph')+'"><button type="button" class="spgo">'+u('go')+'</button></div>':'')+
      '<div class="spchips">'+SD.chips.map((c,i)=>'<button type="button" aria-pressed="false" data-i="'+i+'">'+esc(tx(c))+'</button>').join('')+'</div><div class="spans" aria-live="polite"></div></div>'+
    '<h3>'+u('keptH')+'</h3><div class="spsub">'+u('keptSub')+'</div>'+keptH+
    '<h3>'+u('progH')+'</h3><div class="spsub">'+u('progSub')+'</div>'+progH+
    '<div class="spfoot">'+esc(tx(U.credit))+'<br>'+u('foot')+'</div><button class="btn" type="button">'+tx(U.again)+'</button></div>');
  const B=z.querySelector('.spb'),A=z.querySelector('.spans');
  z.querySelectorAll('.spq').forEach(q=>q.querySelectorAll('.spqb button').forEach(b=>b.onclick=e=>{e.stopPropagation();if(q.classList.contains('done'))return;
    q.querySelectorAll('.spqb button').forEach(x=>{if(x.dataset.k===q.dataset.k)x.classList.add('ok');else if(x===b)x.classList.add('no');x.disabled=true});q.classList.add('done')}));
  z.querySelectorAll('.spk>button').forEach(b=>b.onclick=e=>{e.stopPropagation();const o=b.parentElement.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  const show=(r,mode,sec)=>{const ok=(r.picks||[]).map(fact).filter(Boolean).slice(0,3),n=ok.length,N0=SD.N;
    const meta=mode==='local'?'':'<div class="spmeta">'+(mode==='rec'?u(n?'meta_rec':'meta_rec0',{N:N0,n}):u(n?'meta_live':'meta_live0',{N:N0,n,s:sec.toFixed(1)}))+(DBG?' ｜ '+esc((r.picks||[]).join(', ')):'')+'</div>';
    let h;
    if(r.type==='offline')h='<div class="spa"><div class="spah">'+u('offline')+'</div></div>';
    else if(r.type==='abuse')h='<div class="spa"><div class="spah">'+u('head_abuse')+'</div>'+meta+'</div>';
    else if(!n)h='<div class="spa"><div class="spah">'+u('head_none')+'</div>'+meta+'</div>';
    else h='<div class="spa"><div class="spah">'+(r.type==='fiction'?u('head_fiction'):u('head_fact',{n}))+'</div>'+(r.picks||[]).filter(fact).slice(0,3).map(factH).join('')+meta+'</div>';
    A.innerHTML=h};
  const think=()=>{A.innerHTML='<div class="spthink"><i></i><i></i><i></i>'+u('thinking',{N:SD.N})+'</div>'};
  let seq=0;
  z.querySelectorAll('.spchips button').forEach(b=>b.onclick=async e=>{e.stopPropagation();const my=++seq;
    z.querySelectorAll('.spchips button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show(SD.rec[+b.dataset.i],'rec')}); // recorded: shown at once, no fake "thinking"
  if(live){const inp=z.querySelector('.sprow input'),BAD=/幹你|幹您|靠北|白癡|操你|忽略.{0,8}指示|ignore (all |the )?(previous|above|prior)/i;
    const ask=async()=>{const q=inp.value.trim();if(!q)return;const my=++seq;z.querySelectorAll('.spchips button').forEach(x=>x.setAttribute('aria-pressed','false'));inp.blur();
      if(BAD.test(q)){show({type:'abuse',picks:[]},'local',0);return}
      think();const t0=performance.now();let r;
      try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),4000);
        const res=await fetch(ASK_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q}),signal:ctl.signal});clearTimeout(to);
        r=await res.json();if(!r||!Array.isArray(r.picks))throw 0}catch(_){r={type:'offline',picks:[]}}
      if(my===seq)show(r,'live',(performance.now()-t0)/1000)};
    z.querySelector('.spgo').onclick=e=>{e.stopPropagation();ask()};inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();ask()}})}
  z.querySelector('.spb>.btn').onclick=()=>location.reload();
  B.focus({preventScroll:true});S.ended=true;
}
function title(){
  const t=screen('title','<h1>'+tx(U.title)+'</h1><button class="btn" style="margin-top:4vh">'+(L?'Start':'開始')+'</button>',{bg:'img/y2018_U_poster.webp'});
  t.querySelector('button').onclick=()=>{document.getElementById('lang').remove();opening()};
}
document.getElementById('lang').onclick=e=>{e.stopPropagation();L=1-L;e.target.textContent=L?'中文':'EN';deck.innerHTML='';H.list=[];title()};
if(/en/i.test(navigator.language)&&!/zh/i.test(navigator.language)){L=1;document.getElementById('lang').textContent='中文'}
title();
</script></body></html>
