<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby or Bust｜我們這一班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
:root{--pink:#E8A9B0;--fade:#D9B8B8;--paper:#F3ECE9;--grey:#9C9898;--ink:#3A3434;--night:#2F3B52}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night)}
body{color:var(--ink);font-family:"Huninn",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#feed{max-width:440px;margin:0 auto;padding:0 14px 40vh;display:flex;flex-direction:column;gap:14px}
.hand{font-family:"LXGW WenKai TC",serif}
.yr{color:var(--paper);font-size:30px;letter-spacing:3px;padding:36px 0 0;opacity:.9}
.news{background:var(--paper);border-radius:4px;padding:10px 12px;font-size:15px;line-height:1.55;box-shadow:0 2px 0 #0003;transform:rotate(-.4deg)}
.wall{position:relative;height:72vh;max-height:560px;min-height:340px;background:var(--paper);border-radius:3px;overflow:hidden;touch-action:pan-y;box-shadow:0 8px 20px #0007}
.half{position:absolute;top:0;bottom:0;width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;transition:filter .35s,background .35s,opacity .35s}
.half.L{left:0}.half.R{right:0}
.half svg{width:68%;max-width:130px}
.who{font-size:20px;margin-top:6px}
.cap{font-size:14px;line-height:1.45;margin-top:4px;color:#5a5050}
.on{background:var(--pink)}
.off{filter:grayscale(1);background:#e2dedc}
.cut{filter:grayscale(1);background:#d6d2d0;opacity:.55}
.fold{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);background:repeating-linear-gradient(#0002 0 6px,transparent 6px 12px)}
.wall.done .fold{background:repeating-linear-gradient(#3A3434aa 0 8px,transparent 8px 14px)}
.aside{position:absolute;right:8px;top:30%;z-index:2;background:#F3ECE9dd;padding:4px 6px;width:46%;font-size:14px;line-height:1.45;color:var(--ink);transform:rotate(1.5deg)}
.slogan{position:absolute;top:14px;z-index:2;width:46%;background:#fffe;border-radius:18px;padding:7px 10px;text-align:center;font-size:16px;line-height:1.35;opacity:0;transition:opacity .25s}
.slogan.show{opacity:1}
.pub{position:absolute;left:50%;bottom:-60px;transform:translateX(-50%);border:0;border-radius:22px;padding:10px 26px;font:inherit;font-size:17px;background:var(--ink);color:var(--paper);transition:bottom .25s}
.pub.show{bottom:12px}
.hint{position:absolute;left:50%;top:44%;font-size:34px;animation:wig 1.4s ease-in-out infinite;pointer-events:none}
@keyframes wig{0%,100%{transform:translateX(-90%)}50%{transform:translateX(-10%)}}
.note{align-self:flex-end;background:#f6e27a;padding:8px 12px;font-size:15px;transform:rotate(2deg);box-shadow:0 2px 4px #0004;max-width:75%}
.bub{align-self:flex-start;background:#fff;border-radius:14px;padding:7px 11px;font-size:15px;max-width:85%}
.bub i{display:block;font-style:normal;font-size:12px;color:var(--grey)}
.bub.gone{filter:grayscale(1);opacity:.6}
.obj{align-self:center;width:62%;background:#fff;padding:10px 10px 14px;font-size:15px;line-height:1.5;text-align:center;box-shadow:0 3px 8px #0005;transform:rotate(-1.5deg)}
.obj.gray{filter:grayscale(1);background:#ddd}
.in{animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
#files{position:fixed;top:10px;right:max(10px,calc(50% - 210px));display:flex;flex-direction:column-reverse;width:34px;z-index:3;pointer-events:none}
#files div{height:4px;margin-top:1px;background:#e9dcc6;border:1px solid #b9a98f}
.class{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:var(--paper);padding:16px 8px;border-radius:3px}
.mate{width:22%;text-align:center;font-size:13px;transition:transform 1.6s ease-in,opacity 1.6s ease-in}
.mate svg{width:70%}
.mate.g{filter:grayscale(1);opacity:.55}
.mate.walk{transform:translateX(160px);opacity:0}
.src{color:#b9b2b0;font-size:12px;line-height:1.7}
.again{align-self:center;border:0;border-radius:22px;padding:10px 26px;font:inherit;font-size:17px;background:var(--paper);color:var(--ink)}
.title{color:var(--paper);text-align:center;padding:30vh 0 0}
.title h1{font-weight:normal;font-size:30px}
.title p{margin-top:14px;line-height:1.7;opacity:.85}
.title button{margin-top:28px}

.half{padding:0;justify-content:flex-end}
.half .pic{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.half .lab{position:relative;width:100%;background:linear-gradient(transparent,#F3ECE9ee 35%);padding:26px 8px 62px}
.half .who{font-size:18px;margin:0}
.obj img,.objimg{width:100%;display:block;margin-bottom:6px}
.mate img{width:70%;display:block;margin:0 auto;mix-blend-mode:multiply}
.lang{position:fixed;top:10px;left:max(10px,calc(50% - 210px));z-index:3;border:0;border-radius:14px;padding:4px 10px;font:inherit;font-size:13px;background:#F3ECE9cc;color:var(--ink)}
.qs{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;max-width:92%}
.qs button{border:1px solid #b9b2b0;background:transparent;color:var(--paper);border-radius:14px;padding:4px 10px;font:inherit;font-size:13px}
.qs button:disabled{opacity:.35}
.ans{align-self:flex-start;background:#e9e5e3;border-radius:14px;padding:7px 11px;font-size:15px;max-width:85%;filter:grayscale(1)}
.ans i{display:block;font-style:normal;font-size:12px;color:var(--grey)}
.self{align-self:center;color:var(--paper);font-size:16px;line-height:1.6;text-align:center;max-width:90%;opacity:.9}
.credit{color:#8f8a88;font-size:11px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<button id="lang" class="lang">EN</button>
<div id="files"></div>
<div id="feed"></div>
<script src="data.js"></script>
<script>
// Baby or Bust — prop7. Written from scratch during the hackathon (2026-10-27).
// Text drafted with Meta Muse Spark 1.3, art by Meta Muse Image 1.0 (see data.js). Final insider copy by the author.
const N=DATA.nodes;let L=0; // 0=zh 1=en
const tx=a=>Array.isArray(a)?(a[L]||a[0]):a;
const nm=w=>L?(DATA.names[w]||w):w;
const S={node:'y2018',self:0,gone:[],cutIn:{},seen:[],laoyanGray:false,path:[],step:0,busy:false};
const feed=document.getElementById('feed');
const SAT=[1,.88,.78,.68,.6,.52,.46];
const LIFE=[['她傳來的照片，還是彩色的。','Her photo still comes in color.'],['「晚餐還等妳嗎？」　未讀','"Still waiting for you for dinner?"  Unread'],['冰箱上的凍卵回診單，過期了。','The egg-freezing follow-up slip on the fridge. Expired.'],['框裡只剩一隻手。','Only one hand left in the frame.']];
const UI={start:['上班','Clock in'],pub:['發布','Publish'],again:['再拍一次','Shoot again'],intro:['2018，老顏 26 歲。<br>少子女化對策辦公室。','2018. Lao Yan is 26.<br>Office of Birth-Rate Countermeasures.'],
 obj19:['5/24 被圈了起來。<br>兩只一樣的戒指。','May 24, circled.<br>Two identical rings.'],end:['職務代理津貼每日 800 元。','Cover-duty allowance: NT$800 per day.'],
 q:[['後來呢？','And then?'],['妳怪我嗎？','Do you blame me?'],['那時候你需要的是什麼？','What did you need back then?']],
 kids:['本班一共 {n} 個小朋友。你都是我們的好同學。','Our class has {n} kids in total. You are all our good classmates.'],
 credit:['文字初稿與翻譯：Meta Muse Spark 1.3　插畫：Meta Muse Image 1.0　政策與數字皆有出處','Draft copy & translation: Meta Muse Spark 1.3 · Illustrations: Meta Muse Image 1.0 · Every policy and number is sourced']};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function add(cls,html,sat){const d=document.createElement('div');d.className=cls+' in';d.innerHTML=html;if(sat!=null)d.style.filter='saturate('+sat+')';feed.appendChild(d);return d}
function down(el){el.scrollIntoView({behavior:'smooth',block:el.classList.contains('wall')?'center':'end'})}
function files(){const f=document.getElementById('files');f.innerHTML='<div></div>'.repeat(1+S.step*2+S.self*3)}
function lifeIdx(){return Math.min(S.self,3)}
async function year(){
  const n=N[S.node],sat=SAT[Math.min(S.step,SAT.length-1)];
  add('yr',n.year,sat);
  if(n.year===2019){await wait(250);down(add('obj hand','<img src="img/obj_2019.webp" alt="">'+tx(UI.obj19),sat))}
  await wait(300);add('news',tx(n.news),sat);await wait(400);
  let rcap=tx(n.R.cap);if(n.final&&S.self>0)rcap+='<br>'+tx(LIFE[lifeIdx()]);
  const firstTime=!S.seen.includes(n.R.id);
  const half=(s,who,cap)=>'<div class="half '+s+'"><div class="pic" style="background-image:url(img/'+S.node+'_'+s+'.webp)"></div><div class="lab"><div class="who">'+nm(who)+'</div><div class="cap hand">'+cap+'</div></div></div>';
  const w=add('wall',half('L',n.L.who,tx(n.L.cap))+half('R',n.R.who,rcap)+'<div class="fold"></div>'+
   ((n.final||firstTime)?'<div class="aside hand">'+tx(n.R.aside)+'</div>':'')+
   '<div class="slogan"></div>'+(S.step===0?'<div class="hint">👆</div>':'')+'<button class="pub">'+tx(UI.pub)+'</button>',sat);
  S.seen.push(n.R.id);bindWall(w);down(w);
}
function bindWall(w){
  let x0=null,y0=null,pick=null;
  const set=side=>{pick=side;
    w.querySelector('.half.L').className='half L '+(side==='L'?'on':'off');
    w.querySelector('.half.R').className='half R '+(side==='R'?'on':'off');
    const s=w.querySelector('.slogan');s.textContent=tx(N[S.node][side].slogan);s.style.left=side==='L'?'2%':'52%';s.classList.add('show');
    const h=w.querySelector('.hint');if(h)h.remove();w.querySelector('.pub').classList.add('show');};
  w.preview=set;
  w.addEventListener('pointerdown',e=>{if(w.classList.contains('done'))return;x0=e.clientX;y0=e.clientY});
  w.addEventListener('pointerup',e=>{
    if(x0===null||e.target.classList.contains('pub'))return;
    const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))set(dx<0?'L':'R');
    else if(Math.abs(dx)<10&&Math.abs(dy)<10){const r=w.getBoundingClientRect();set(e.clientX-r.left<r.width/2?'L':'R')}
  });
  w.querySelector('.pub').onclick=()=>{if(pick&&!S.busy)publish(w,pick)};
}
function cut(id,node){if(!S.gone.includes(id))S.gone.push(id);(S.cutIn[id]=S.cutIn[id]||[]).push(node)}
async function publish(w,side){
  S.busy=true;const n=N[S.node],sat=SAT[Math.min(S.step,SAT.length-1)],other=side==='L'?'R':'L';
  w.classList.add('done');w.querySelector('.pub').remove();
  w.querySelector('.half.'+other).className='half '+other+' cut';
  const a=w.querySelector('.aside');if(a)a.remove();
  S.path.push({year:n.year,node:S.node,side});
  await wait(500);
  if(n.final){if(side==='L')S.laoyanGray=true;else cut('同事',S.node);files();S.busy=false;return reunion()}
  if(side==='L')cut(n.R.id,S.node);else S.self++;
  files();
  down(add('note hand',tx(n.boss[side]),sat));await wait(700);
  const c=n.chat[side];down(add('bub'+(S.gone.includes(c[0])?' gone':''),'<i>'+nm(c[0])+'</i>'+(L?c[2]:c[1]),sat));await wait(700);
  if(side==='R'){down(add('obj hand gray','<img src="img/life_'+lifeIdx()+'.webp" alt="">'+tx(LIFE[lifeIdx()]),sat));await wait(800)}
  S.node=n.next[side];S.step++;S.busy=false;await year();
}
function rkey(m){return m+'|'+S.cutIn[m].slice().sort().join(',')}
async function reunion(){
  await wait(400);add('yr','2026');add('news',tx(UI.end));await wait(400);
  const mates=['阿芳','家豪','宜君','志豪','小芸老師','同事','佩珊','冠宇','老顏'];
  const ph=add('class',mates.map(m=>'<div class="mate'+((S.gone.includes(m)||(m==='老顏'&&S.laoyanGray))?' g':'')+'" data-m="'+m+'"><img src="img/p_'+DATA.slug[m]+'.webp" alt=""><div>'+nm(m)+'</div></div>').join(''));
  down(ph);await wait(1400);
  for(const m of S.gone){
    const el=ph.querySelector('[data-m="'+m+'"]');if(el)el.classList.add('walk');
    await wait(900);
    const r=DATA.reunion[rkey(m)];if(!r)continue;
    down(add('bub gone','<i>'+nm(m)+'</i>'+(L?r.line_en:r.line)));
    const qs=add('qs',UI.q.map((q,i)=>'<button data-i="'+i+'">'+tx(q)+'</button>').join(''));
    let last=qs;qs.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.disabled=true;const q=r.qa[+b.dataset.i];const d=add('ans','<i>'+nm(m)+'</i>'+(L?q.a_en:q.a));last.after(d);last=d;});
    await wait(900);
  }
  const tier=S.self>=3?'3+':String(S.self);const me=DATA.reunion['老顏|'+tier+(S.laoyanGray?'|gray':'')];
  if(me){await wait(600);down(add('self hand',L?me.line_en:me.line))}
  const kids=2+Math.floor(Math.random()*5);
  await wait(900);down(add('bub','<i>'+nm('阿芳')+'</i>'+tx(UI.kids).replace('{n}',kids)));
  await wait(900);
  const srcs=[...new Set(S.path.map(p=>p.year+'　'+N[p.node].src))];
  add('src',srcs.join('<br>')+'<br>2026　行政院 2026-05');
  add('credit',tx(UI.credit));
  const b=add('again',tx(UI.again));b.setAttribute('role','button');b.onclick=()=>location.reload();down(b);
  S.ended=true;
}
function title(){
  const t=add('title','<h1>'+(L?'Our Class':'我們這一班')+'</h1><p class="hand">'+tx(UI.intro)+'</p><button class="again">'+tx(UI.start)+'</button>');
  t.querySelector('button').onclick=()=>{t.remove();document.getElementById('lang').remove();files();year()};
}
document.getElementById('lang').onclick=()=>{L=1-L;document.getElementById('lang').textContent=L?'中文':'EN';feed.innerHTML='';title()};
if(/en/i.test(navigator.language)&&!/zh/i.test(navigator.language)){L=1;document.getElementById('lang').textContent='中文'}
title();
</script></body></html>
